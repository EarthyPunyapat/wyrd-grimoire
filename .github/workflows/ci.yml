name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, lint, test, pack validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The server targets Windows 11 and Linux (spec 01).
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run wyrd pack validate packs/fantasy-core
      - run: bun run build
      - run: bun audit

  browser:
    name: Desktop and phone browser flows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 7
