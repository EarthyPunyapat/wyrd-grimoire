  archetypes: [hunter]
  multiclass: { allowed: false, maxClasses: 2 }
  levels:
    - { level: 1, xp: 0 }
    - level: 2
      xp: 10
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Trailcraft
          description: "Broken twigs, shifted stones and the smell of a campfire tell you who passed and how long ago."
    - level: 3
      xp: 30
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Keen Eye
          description: "You pick a shape out of cover before it moves and know which way it will run."
    - level: 4
      xp: 60
      classSkillPoints: 20
      anySkillPoints: 5
      attributePoints: 1
    - level: 5
      xp: 100
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Marked Quarry
          description: "Once you have chosen a target, every step you take closes the distance."
    - { level: 6, xp: 150, classSkillPoints: 20, anySkillPoints: 5 }
    - level: 7
      xp: 210
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Silent Step
          description: "You move through dead leaves and gravel without a sound, and the woods keep your secret."
    - level: 8
      xp: 280
      classSkillPoints: 20
      anySkillPoints: 5
      attributePoints: 1
    - { level: 9, xp: 360, classSkillPoints: 20, anySkillPoints: 5 }
    - level: 10
      xp: 450
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: The Long Shot
          description: "You take the shot others would call impossible, and the arrow finds the seam."

