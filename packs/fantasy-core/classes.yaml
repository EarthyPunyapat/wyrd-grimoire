    - { level: 1, xp: 0 }
    - level: 2
      xp: 10
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Benediction
          description: "A few words and a steady hand ease fear and close small wounds."
    - level: 3
      xp: 30
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Bedside Manner
          description: "You have sat with the dying long enough to know what the living need to hear."
    - level: 4
      xp: 60
      classSkillPoints: 20
      anySkillPoints: 5
      attributePoints: 1
    - level: 5
      xp: 100
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Steadfast
          description: "Your faith is a floor under your feet. Terror and doubt break against it."
    - { level: 6, xp: 150, classSkillPoints: 20, anySkillPoints: 5 }
    - level: 7
      xp: 210
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Intercession
          description: "You can call on your power for another, taking the risk of being heard onto yourself."
    - level: 8
      xp: 280
      classSkillPoints: 20
      anySkillPoints: 5
      attributePoints: 1
    - { level: 9, xp: 360, classSkillPoints: 20, anySkillPoints: 5 }
    - level: 10
      xp: 450
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Living Saint
          description: "People see something in you that they cannot name, and the desperate come to your door."

- id: ranger
  name: Ranger
  description: "A patient wanderer of wild places who reads ground, weather and quarry better than most read a map."
  skills: [ranged, survival, perception, stealth, navigation, athletics]
