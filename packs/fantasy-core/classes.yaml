    - level: 3
      xp: 30
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Gossip Network
          description: "Every town has a person who knows everything. You know that person."
    - level: 4
      xp: 60
      classSkillPoints: 20
      anySkillPoints: 5
      attributePoints: 1
    - level: 5
      xp: 100
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Rousing Song
          description: "Your music lifts tired arms and steadies shaking hands, and the fight goes on."
    - { level: 6, xp: 150, classSkillPoints: 20, anySkillPoints: 5 }
    - level: 7
      xp: 210
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Cutting Wit
          description: "A few well-chosen words can make a proud man look small in front of his friends."
    - level: 8
      xp: 280
      classSkillPoints: 20
      anySkillPoints: 5
      attributePoints: 1
    - { level: 9, xp: 360, classSkillPoints: 20, anySkillPoints: 5 }
    - level: 10
