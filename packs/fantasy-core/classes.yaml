# Classes for class-mode campaigns (spec 04). Levels 1-10, XP at 10 x n(n-1)/2.
# Each level from 2 grants 20 class-skill points (at most 10 per skill) and 5 any-skill points.
# Attribute points arrive at levels 4 and 8. No level grants HP.
- id: fighter
  name: Fighter
  description: "A trained combatant who wins by holding the line and making the other side break first."
  skills: [melee, athletics, dodge, intimidation, perception, medicine]
  maxPointsPerSkillPerLevel: 10
  archetypes: [sellsword]
  multiclass: { allowed: false, maxClasses: 2 }
  levels:
    - { level: 1, xp: 0 }
    - level: 2
      xp: 10
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Hold the Line
          description: "You plant your feet and the line holds. Allies who fight beside you keep their nerve when a charge breaks."
    - level: 3
      xp: 30
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Weapon Drill
          description: "Long hours with a weapon make its weight an extension of your arm; you find the gap in a guard faster."
    - level: 4
      xp: 60
      classSkillPoints: 20
      anySkillPoints: 5
      attributePoints: 1
    - level: 5
      xp: 100
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Second Wind
          description: "A breath and a shift of grip, and the weariness falls away. You press on when others would drop."
    - { level: 6, xp: 150, classSkillPoints: 20, anySkillPoints: 5 }
    - level: 7
      xp: 210
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Shield Wall
          description: "With a shield or a stout door, you turn a corridor into a wall that costs the enemy dearly."
    - level: 8
      xp: 280
      classSkillPoints: 20
      anySkillPoints: 5
      attributePoints: 1
    - { level: 9, xp: 360, classSkillPoints: 20, anySkillPoints: 5 }
    - level: 10
      xp: 450
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Unbroken
          description: "You have outlasted better fighters than you. Fear finds no purchase, and neither does the first blow."

- id: rogue
  name: Rogue
  description: "A quick-handed survivor who wins by being somewhere the enemy did not expect."
  skills: [sleight-of-hand, stealth, deception, acrobatics, perception, streetwise]
  maxPointsPerSkillPerLevel: 10
  archetypes: [cutpurse]
  multiclass: { allowed: false, maxClasses: 2 }
  levels:
    - { level: 1, xp: 0 }
    - level: 2
      xp: 10
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Quick Hands
          description: "Your fingers move before the eye can follow, whether in a purse, a lock or a sleeve."
    - level: 3
      xp: 30
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Read the Room
          description: "You notice who is watching, who is armed and which exit nobody is guarding."
    - level: 4
      xp: 60
      classSkillPoints: 20
      anySkillPoints: 5
      attributePoints: 1
    - level: 5
      xp: 100
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Low Blow
          description: "You know where a fight is won: knees, throat, and the moment an enemy looks away."
    - { level: 6, xp: 150, classSkillPoints: 20, anySkillPoints: 5 }
    - level: 7
      xp: 210
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Vanishing Act
          description: "A turned corner, a crowd, a fallen cloak, and you are simply not where you were."
    - level: 8
      xp: 280
      classSkillPoints: 20
      anySkillPoints: 5
      attributePoints: 1
    - { level: 9, xp: 360, classSkillPoints: 20, anySkillPoints: 5 }
    - level: 10
      xp: 450
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Ghost of the Alley
          description: "Locks open for you, guards remember nothing, and no door in the city is truly closed."

- id: mage
  name: Mage
  description: "A student of the old workings who pays for power in strain, patience and dangerous curiosity."
  skills: [spellcasting, arcana, lore, investigation, insight, language]
  maxPointsPerSkillPerLevel: 10
  archetypes: [hedge-wizard]
  multiclass: { allowed: false, maxClasses: 2 }
  levels:
    - { level: 1, xp: 0 }
    - level: 2
      xp: 10
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Grimoire
          description: "You keep a book of signs, mistakes and remedies. It is the most dangerous thing you own."
    - level: 3
      xp: 30
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Focused Casting
          description: "You can hold a working together through pain, noise and a blade at your back."
    - level: 4
      xp: 60
      classSkillPoints: 20
      anySkillPoints: 5
      attributePoints: 1
    - level: 5
      xp: 100
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Warded Mind
          description: "You have learned to close the doors of your own thoughts against things that would walk through them."
    - { level: 6, xp: 150, classSkillPoints: 20, anySkillPoints: 5 }
    - level: 7
      xp: 210
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Twin Signs
          description: "You split a working in two, paying for it in strain rather than in time."
    - level: 8
      xp: 280
      classSkillPoints: 20
      anySkillPoints: 5
      attributePoints: 1
    - { level: 9, xp: 360, classSkillPoints: 20, anySkillPoints: 5 }
    - level: 10
      xp: 450
      classSkillPoints: 20
      anySkillPoints: 5
      features:
        - name: Master of the Art
          description: "The old workings answer you now. What once took a circle and a night takes a word."

- id: priest
