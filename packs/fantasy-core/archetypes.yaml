- id: sellsword
  name: Sellsword
  description: A blade for hire who has seen enough fights to know how few of them are worth the pay.
  suggestedAttributes: { str: 7, agi: 6, end: 7, int: 4, awa: 5, wil: 5, pre: 5 }
  skills: { melee: 70, dodge: 50, athletics: 45, intimidation: 35, perception: 30, streetwise: 25, survival: 25, medicine: 20 }
  talent: line-veteran
  kit:
    - { item: arming-sword }
    - { item: padded-jack }
    - { item: open-helmet }
    - { item: backpack }
    - { item: bedroll }
    - { item: rations, qty: 3 }
  backstoryPrompts:
    - Who did you last fight for, and why did you stop?
    - What is the one job you refused?
