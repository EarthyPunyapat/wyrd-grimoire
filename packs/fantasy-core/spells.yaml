# Spells for the fantasy-core pack (spec 05, the spellcasting plugin).
# The engine resolves every effect; this file is data only. Schools: elemental, healing,
# illusion, warding. Tiers set strain through the engine's tuning table.
- id: cinder-lance
  name: Cinder Lance
  description: A needle of flame leaps from the caster's palm.
  school: elemental
  tier: 1
  apCost: 1
  range: near
  target: actor
  check: { skill: spellcasting/elemental, difficulty: easy }
  effects:
    - { kind: damage, amount: 3, damageType: fire }
  tags: [fire]

- id: ember-veil
  name: Ember Veil
  description: Warm sparks cling to the caster, warding off the cold.
  school: elemental
  tier: 1
  apCost: 1
  range: self
  target: self
  check: { skill: spellcasting/elemental, difficulty: easy }
  effects:
    - { kind: applyCondition, conditionId: core:warded, note: "warmth" }
  durationMinutes: 60
  tags: [fire, warmth]

